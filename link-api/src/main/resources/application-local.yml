spring:
  datasource:
    url: jdbc:mysql://103.205.254.30:33306/tolink_rag_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=5000
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 0
      min-idle: 2
      max-active: 8
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      keep-alive: true
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 300000
  redis:
    host: 103.205.254.30
    port: 36379
    password: ${REDIS_PASSWORD}
    database: 0
    timeout: 2s
    lettuce:
      shutdown-timeout: 100ms
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 1000ms
  kafka:
    bootstrap-servers: 103.205.254.30:39092
    listener:
      auto-startup: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}"
        password="${KAFKA_SASL_PASSWORD}";
  config:
    import: optional:file:./config/application-local-secrets.yml
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.qingluo.link.mapper: ${SQL_LOG_LEVEL:info}
tolink:
  mq:
    vender: kafka
    scan-base-packages:
    - com.qingluo
    kafka-auto-create-topics: true
    kafka-topic-partitions: 1
    kafka-topic-replicas: 1
  oss:
    service-type: minio
    file-root-path: ${user.home}/.tolink/oss
    public-base-url: /api/v1/oss-files/public
    minio:
      endpoint: http://103.205.254.30:39000
      raw-bucket-name: tolink-rag-raw
      private-bucket-name: tolink-rag-docs
      public-bucket-name: tolink-public
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
    aliyun-oss:
      endpoint: null
      public-bucket-name: null
      private-bucket-name: null
      access-key-id: null
      access-key-secret: null
  document-file:
    max-size-bytes: 20971520
    internal-base-url: http://tolink-service:8080
    service-token: null
    sse-timeout-ms: 300000
  parse-result:
    stuck:
      default-threshold: 5m
      scan-interval-ms: 60000
      dataset-thresholds: {}
  recall:
    session-jwt-secret: ${RECALL_SESSION_JWT_SECRET}
    session-jwt-exp-seconds: ${RECALL_SESSION_JWT_EXP_SECONDS:30}
    session-stream-base-url: ${RECALL_SESSION_STREAM_BASE_URL:http://localhost:8000}
  llm:
    api-key:
      secret: ${LLM_SECRET}
