spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=5000
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: ${DRUID_INITIAL_SIZE:0}
      min-idle: ${DRUID_MIN_IDLE:2}
      max-active: ${DRUID_MAX_ACTIVE:8}
      max-wait: ${DRUID_MAX_WAIT:3000}
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      keep-alive: true
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 300000

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}
    timeout: 2s
    lettuce:
      shutdown-timeout: 100ms
      pool:
        max-active: ${REDIS_POOL_MAX_ACTIVE:8}
        max-idle: ${REDIS_POOL_MAX_IDLE:8}
        min-idle: ${REDIS_POOL_MIN_IDLE:0}
        max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME}"
        password="${KAFKA_SASL_PASSWORD}";

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.qingluo.link.mapper: ${SQL_LOG_LEVEL:info}

thread-pool:
  document-upload:
    core-pool-size: ${THREAD_POOL_CORE_SIZE:5}
    max-pool-size: ${THREAD_POOL_MAX_SIZE:10}
    queue-capacity: ${THREAD_POOL_QUEUE_CAPACITY:50}
    keep-alive-seconds: ${THREAD_POOL_KEEP_ALIVE_SECONDS:60}
    thread-name-prefix: ${THREAD_POOL_THREAD_NAME_PREFIX:document-file-upload-}

tolink:
  mq:
    vender: ${TOLINK_MQ_VENDER:${TOLINK_MQ_VENDOR:kafka}}
    scan-base-packages:
      - com.qingluo
    kafka-auto-create-topics: ${KAFKA_AUTO_CREATE_TOPICS:true}
    kafka-topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    kafka-topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}
  oss:
    service-type: ${OSS_SERVICE_TYPE:minio}
    file-root-path: ${OSS_FILE_ROOT_PATH:${user.home}/.tolink/oss}
    public-base-url: ${OSS_PUBLIC_BASE_URL:/api/v1/oss-files/public}
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      raw-bucket-name: ${MINIO_RAW_BUCKET:tolink-rag-raw}
      private-bucket-name: ${MINIO_PRIVATE_BUCKET:tolink-rag-docs}
      public-bucket-name: ${MINIO_PUBLIC_BUCKET:tolink-public}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
    aliyun-oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      public-bucket-name: ${ALIYUN_OSS_PUBLIC_BUCKET:}
      private-bucket-name: ${ALIYUN_OSS_PRIVATE_BUCKET:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  document-file:
    max-size-bytes: ${DOCUMENT_FILE_MAX_SIZE_BYTES:20971520}
    internal-base-url: ${DOCUMENT_FILE_INTERNAL_BASE_URL:http://tolink-service:8080}
    service-token: ${DOCUMENT_FILE_SERVICE_TOKEN:}
  recall:
    session-jwt-secret: ${RECALL_SESSION_JWT_SECRET}
    session-jwt-exp-seconds: ${RECALL_SESSION_JWT_EXP_SECONDS:30}
    session-stream-base-url: ${RECALL_SESSION_STREAM_BASE_URL:http://localhost:8000}
  llm:
    api-key:
      secret: ${LLM_SECRET}
