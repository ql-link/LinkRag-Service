spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:tolink-mysql}:${DB_PORT:3306}/${DB_NAME:tolink_rag_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=5000
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 0
      min-idle: 2
      max-active: 8
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      keep-alive: true
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 300000
  redis:
    host: ${REDIS_HOST:tolink-redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DB:0}
    timeout: 2s
    lettuce:
      shutdown-timeout: 100ms
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 1000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:100.77.31.79}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/tolink-prod}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: ${RABBITMQ_PREFETCH:10}
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.86.10.52:9092}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}"
        password="${KAFKA_SASL_PASSWORD}";
  config:
    import: optional:file:./config/application-prod-local.yml
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.qingluo.link.mapper: ${SQL_LOG_LEVEL:info}
tolink:
  mq:
    vender: ${TOLINK_MQ_VENDER:rabbitMQ}
    scan-base-packages:
    - com.qingluo
    kafka-auto-create-topics: false
    kafka-topic-partitions: 1
    kafka-topic-replicas: 1
    rabbitmq-dlq-suffix: .DLT
    rabbitmq-delayed-message-enabled: false
  oss:
    service-type: ${OSS_SERVICE_TYPE:minio}
    file-root-path: ${user.home}/.tolink/oss
    public-base-url: /tolink-public
    minio:
      endpoint: ${MINIO_ENDPOINT:http://tolink-minio:9000}
      raw-bucket-name: ${MINIO_RAW_BUCKET:tolink-rag-raw}
      private-bucket-name: ${MINIO_PRIVATE_BUCKET:tolink-rag-docs}
      public-bucket-name: ${MINIO_PUBLIC_BUCKET:tolink-public}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
    aliyun-oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      public-bucket-name: null
      private-bucket-name: null
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  document-file:
    max-size-bytes: 20971520
    internal-base-url: ${DOCUMENT_FILE_INTERNAL_BASE_URL:http://tolink-service:8080}
    service-token: ${DOCUMENT_FILE_SERVICE_TOKEN:}
    sse-timeout-ms: 300000
  parse-result:
    stuck:
      default-threshold: 5m
      scan-interval-ms: 60000
      dataset-thresholds: {}
  recall:
    session-jwt-secret: ${RECALL_SESSION_JWT_SECRET}
    session-jwt-exp-seconds: ${RECALL_SESSION_JWT_EXP_SECONDS:30}
    session-stream-base-url: ${RECALL_SESSION_STREAM_BASE_URL:https://linkrag.cn}
  llm:
    api-key:
      secret: ${LLM_SECRET}
