# 部署用 compose：引用本机 docker build 出来的镜像并启动
# application-prod.yml 随代码打入镜像；真实密钥不进镜像/不进 Git，运行时单文件挂载注入。
# 用法：TAG=xxx SERVICE_SECRET_CONFIG_FILE=../config/application-prod-local.yml \
#   docker compose -f deploy/docker-compose.yml up -d
services:
  tolink-service:
    image: tolink-service:${TAG:-latest}
    container_name: tolink-service
    restart: always
    environment:
      # 时区设为东八区
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - RECALL_SESSION_STREAM_BASE_URL=${RECALL_SESSION_STREAM_BASE_URL:-http://117.72.214.40:8000}
      # 管理端日志查询代理访问 Loki；云服务器默认走主机 VPN 地址，可覆盖为同网络内的 http://tolink-loki:3100
      - OBSERVABILITY_LOKI_BASE_URL=${OBSERVABILITY_LOKI_BASE_URL:-http://${HOST_VPN_IP:-100.86.10.52}:3100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 镜像内 application-prod.yml 会通过 spring.config.import 加载此密钥覆盖文件。
      - ${SERVICE_SECRET_CONFIG_FILE:-../config/application-prod-local.yml}:/app/config/${SERVICE_SECRET_CONFIG_NAME:-application-prod-local.yml}:ro
      # 日志持久化：容器 /app/logs（logback 按天文件夹输出）-> 宿主 /opt/tolink/toLink-Service/logs
      - ../logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - tolink-app-net

networks:
  tolink-app-net:
    external: true
