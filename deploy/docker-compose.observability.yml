# 日志追踪栈：Loki + Promtail
# 用法：
#   docker compose -f deploy/docker-compose.observability.yml up -d
#
# 默认采集：
#   Java:   ./logs/*/*.log（相对仓库根目录）
#   Python: ./python-logs/*/*.log（可用 PYTHON_LOG_PATH 覆盖）
services:
  loki:
    image: grafana/loki:2.9.8
    container_name: tolink-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      # 本地验证开放；生产建议仅内网访问或不要映射到公网。
      - "${LOKI_HTTP_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - tolink-observability-net

  promtail:
    image: grafana/promtail:2.9.8
    container_name: tolink-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ../logs:/var/log/tolink-service:ro
      - ${PYTHON_LOG_PATH:-../python-logs}:/var/log/tolink-rag:ro
      - promtail-positions:/tmp
    networks:
      - tolink-observability-net

volumes:
  loki-data:
  promtail-positions:

networks:
  tolink-observability-net:
    name: tolink-observability-net

